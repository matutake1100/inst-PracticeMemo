<section class="info">

        <div class="info_sentence">
            <p>楽器のおともとは楽器の練習が手につかないという悩みを解決するために生まれた練習記録用サイトです！！</p>
            <p>サイトを開いて練習予定を入れ、それを確認して練習をする。<br>そして練習が終わったらいつ何を練習したかを記録して次の練習の時に見れるようにする。そしてまた予定を入れる。</p>
            <p>これらのサポートをすることで練習をしやすくし、練習の質を上げます！</p>
            <p><em>いつでもあなたの隣で楽器の練習を見守っております。</em></p>
